[project]
name = "timesheet"
version = "0.1.0"
description = "Timesheet Django project"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "Django>=6.1.3",
    "holidays>=0.108",
    "python-dateutil>=2.9.0.post0,<3",
    "pytz>=2026.6",
]


[project.urls]
Repository = "https://github.com/simonerigoni/timesheet"
Medium = "https://medium.com/@simone-rigoni01/just-another-boring-timesheet-django-application-39c59e55a0ee"

[dependency-groups]
dev = [
    "django-types>=0.22.0",
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["timesheet_project/*/migrations"]

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
# Type-check the Django app with django-types. Keep migrations out; do not
# exclude the project package itself.
include = ["timesheet_project"]
exclude = [".venv", "**/migrations"]
extraPaths = ["timesheet_project"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "timesheet_project.settings"
pythonpath = ["timesheet_project"]
testpaths = ["tests", "timesheet_project"]
python_files = ["tests.py", "test_*.py"]

