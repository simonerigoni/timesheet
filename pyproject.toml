[project]
name = "timesheet"
version = "0.1.0"
description = "Timesheet Django project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=6.1.3",
    "holidays>=0.108",
    "python-dateutil>=2.9.0.post0,<3",
    "pytz>=2026.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["timesheet_project/*/migrations"]

[tool.ruff.lint]
# Keep ruff's pre-0.17 default rule set so ruff upgrades don't enable new lint rules
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# Django model/descriptor typing still needs a dedicated stubs pass (django-stubs
# alone left 50+ false positives). Exclude the app from pyright until then;
# ruff + pytest still cover the tree. CI runs `pyright .`, which honors exclude.
exclude = [".venv", "timesheet_project"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"


